name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate version tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ['REF_NAME']
          if os.environ['REF_TYPE'] != 'tag' or not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag):
              raise SystemExit('Run Release from a vMAJOR.MINOR.PATCH tag, e.g. v1.1.0.')
          version = tag[1:]
          if any(part > limit for part, limit in zip(map(int, version.split('.')), (255, 255, 65535))):
              raise SystemExit('Version exceeds MSI limits (255.255.65535).')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
  build:
    needs: version
    uses: ./.github/workflows/native-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      distribution: github-release
  draft:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages
      - name: Create release draft with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd packages
          test "$(find . -maxdepth 1 -name '*.msi' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          sha256sum -- *.msi *.zip *.json > SHA256SUMS.txt
          printf '%s\n' 'Automated build: x64 and ARM64 MSI installers, CLI archives, and SHA-256 checksums.' '' 'Packages are unsigned. Review and sign release packages as needed before publishing. Microsoft Store submission requires trusted signing and separate validation.' > ../release-notes.md
          # Refuse to overwrite an existing draft or published release.
          gh release create "$RELEASE_TAG" ./* --verify-tag --draft \
            --title "Bluetooth Audio Codec $RELEASE_TAG" --generate-notes --notes-file ../release-notes.md
